services:

  # ── Spring Boot App ────────────────────────────────────────────────────────
  travelhub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelhub-app
    restart: on-failure:5          # auto-restart up to 5 times on crash
    ports:
      - "127.0.0.1:8081:8080"   # host port 8081 → container port 8080 (avoids conflicts)
    environment:
      # Server
      SERVER_PORT: 8080

      # Database — using H2 in-memory (no external DB needed)
      # When you have a real PostgreSQL, replace these 4 lines with your DB credentials
      SPRING_DATASOURCE_URL: jdbc:h2:mem:travelhub;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

      # Mail
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-triphivetours@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      # TripJack API
      TRIPJACK_API_KEY: ${TRIPJACK_API_KEY:-6128192bcff13d-9f45-4bd2-b776-5f54a05c74e9}

      # Feature flags
      TRAVELHUB_MOCK_ENABLED: "false"
      TRAVELHUB_DEBUG_LOG_TRIPJACK: "true"
      TRAVELHUB_DEBUG_DUMP_SEARCH_RESPONSE: "true"

      # Actuator — disable mail & db health checks until credentials are configured
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
    env_file:
      - .env
    # Health check — uses Spring Boot Actuator /actuator/health endpoint
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s       # check every 30 seconds
      timeout: 10s        # fail if no response within 10s
      retries: 5          # mark unhealthy after 5 consecutive failures
      start_period: 60s   # give the JVM 60s to start before first check
    networks:
      - travelhub-net

  # ── ngrok tunnel (free permanent URL — requires NGROK_AUTHTOKEN in .env) ───
  # Free static domain: sign up at https://ngrok.com → copy your authtoken
  # then go to Cloud Edge → Domains to find your free static domain
  # e.g. abc-xyz-123.ngrok-free.app  (never changes, even after restarts)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: travelhub-ngrok
    restart: on-failure:5
    command: http travelhub-app:8080 --url=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      travelhub-app:
        condition: service_healthy  # only start after app is healthy
    networks:
      - travelhub-net

networks:
  travelhub-net:
    driver: bridge
